name: pvz_formation_editor
description: PVZ Formation Editor · 植物大战僵尸布阵器
publish_to: none
version: 1.0.1+2
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.8'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.3
  sqflite: ^2.3.3+1
  ffi: ^2.1.2
  crypto: ^3.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.24.9
  flutter_lints: ^2.0.3
flutter:
  uses-material-design: true
  assets:
    - assets/branding/app-logo.png
    - assets/catalog.json
    - assets/original/
    - assets/original/image/
    - assets/original/thumbnails/
    - assets/original/image/Aero/
    - assets/original/image/Card/
    - assets/original/audio/
  fonts:
    - family: Continuum Bold
      fonts:
        - asset: assets/original/fonts/ContinuumBold.ttf
