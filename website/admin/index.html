<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>官网统计 · PVZ 布阵器</title><link rel="stylesheet" href="/style.css"><style>main{max-width:1000px}.metrics{display:flex;flex-wrap:wrap;gap:24px}.metric{padding:20px;background:#e9eddf;border-radius:12px;min-width:180px}.metric strong{display:block;font-size:36px}input,select{font:inherit;padding:8px;max-width:100%}table{border-collapse:collapse;width:100%;margin:16px 0}td,th{text-align:left;padding:8px;border-bottom:1px solid #d5ddcd}td:first-child{overflow-wrap:anywhere}.panels{display:grid;grid-template-columns:1fr 1fr;gap:32px}@media(max-width:650px){.panels{grid-template-columns:1fr}}[hidden]{display:none!important}</style></head><body><main><h1 style="font-size:36px">官网访问统计</h1><p><a href="/">返回官网</a> · PVZ 布阵器</p><form id="login"><label for="password">管理员密码</label><br><input id="password" type="password" autocomplete="current-password" required maxlength="128"><button class="button primary">登录</button></form><p id="status" role="status" aria-live="polite"></p><div id="report" hidden><label>时间范围 <select id="days"><option value="7">最近 7 天</option><option value="30" selected>最近 30 天</option><option value="90">最近 90 天</option></select></label> <button class="button" id="refresh">刷新</button> <button class="button" id="logout">退出登录</button><p id="period"></p><div class="metrics" id="metrics"></div><p class="note">访客数按浏览器随机标识去重，并非真实人数；清除浏览器数据或更换设备会计为新访客。下载统计为点击次数，不代表下载完成。尊重 Do Not Track / Global Privacy Control，不统计明确拒绝追踪的浏览器。报表按北京时间汇总，保留最近 400 天。</p><h2>每日趋势</h2><div id="daily"></div><div class="panels"><section><h2>访问页面</h2><div id="pages"></div></section><section><h2>访问来源</h2><div id="sources"></div></section><section><h2>国家 / 地区</h2><div id="countries"></div></section><section><h2>操作点击</h2><div id="actions"></div></section></div></div></main><script src="/admin/admin.js" defer></script></body></html>
